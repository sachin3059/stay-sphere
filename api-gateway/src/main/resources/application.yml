spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: property-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/properties/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
        - id: pricing-service
          uri: http://pricing-service:8085
          predicates:
            - Path=/api/pricing/**
        - id: waitlist-service
          uri: http://waitlist-service:8086
          predicates:
            - Path=/api/waitlist/**
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
        - id: availability-service
          uri: http://availability-service:8088
          predicates:
            - Path=/api/availability/**
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
logging:
  level:
    org.springframework.cloud.gateway: INFO
