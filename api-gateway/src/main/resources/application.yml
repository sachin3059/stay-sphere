spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: property-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/properties/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
        - id: pricing-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/pricing/**
        - id: waitlist-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/waitlist/**
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
        - id: availability-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/availability/**
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
logging:
  level:
    org.springframework.cloud.gateway: INFO
