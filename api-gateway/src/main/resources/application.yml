spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:80}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:160}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@compositeRateLimitKeyResolver}"
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: auth-admin
          uri: http://auth-service:8081
          predicates:
            - Path=/api/admin/users/**
        - id: property-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/properties/**
        - id: property-admin
          uri: http://property-service:8082
          predicates:
            - Path=/api/admin/properties/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
        - id: pricing-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/pricing/**
        - id: waitlist-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/waitlist/**
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
        - id: availability-service
          uri: http://property-service:8082
          predicates:
            - Path=/api/availability/**
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
staysphere:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
logging:
  level:
    org.springframework.cloud.gateway: INFO
