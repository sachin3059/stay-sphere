spring:
  config:
    activate:
      on-profile: local
    import: optional:file:../.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

staysphere:
  mail:
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:StaySphere}
