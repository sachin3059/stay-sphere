spring:
  application:
    name: auth-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staysphere}
    username: ${SPRING_DATASOURCE_USERNAME:staysphere}
    password: ${SPRING_DATASOURCE_PASSWORD:staysphere123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_auth_history
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8081}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
staysphere:
  mail:
    from-email: ${MAIL_FROM_EMAIL:noreply@staysphere.local}
    from-name: ${MAIL_FROM_NAME:StaySphere}
  admin:
    bootstrap-email: ${STAYSPHERE_BOOTSTRAP_ADMIN_EMAIL:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  auth:
    password-reset:
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
      token-ttl-minutes: 60
    email-verification:
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
      token-ttl-hours: 48
